name: Report or Update Incident

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Group :: Service'
        required: true
        type: choice
        default: 'Agentic Engine :: LLM Gateway'
        options:
          - 'All Groups :: All Services'
          - 'Agentic Engine :: All Services'
          - 'Agentic Engine :: Agents'
          - 'Agentic Engine :: APIs'
          - 'Agentic Engine :: Choreographer'
          - 'Agentic Engine :: Data Handler'
          - 'Agentic Engine :: LLM Gateway'
          - 'Agentic Engine :: Orchestrator'
          - 'Agentic Engine :: Secure Vault'
          - 'Agentic Engine :: Worker'
          - 'Agentic Engine :: Workflows'
          - 'Agentic ERP :: All Services'
          - 'Agentic ERP :: Audit Service'
          - 'Agentic ERP :: Data Management'
          - 'Agentic ERP :: Projects'
          - 'Assistant :: All Services'
          - 'Assistant :: Assistant'
          - 'Assistant :: Meeting'
          - 'Infra :: All Services'
          - 'Infra :: Analytics'
          - 'Infra :: Auth Services'
          - 'Infra :: External Queue Management'
          - 'Infra :: IAM Services'
          - 'Infra :: Internal Queue Management'
          - 'Infra :: Notification Services'
          - 'Infra :: Queue Service'
          - 'Infra :: Settings'
          - 'Infra :: Tenant Services'
          - 'Infra :: Timely Job Services'
          - 'Knowledge Repository :: All Services'
          - 'Knowledge Repository :: Document Sign'
          - 'Knowledge Repository :: Documents'
          - 'Knowledge Repository :: Indexer'
          - 'Knowledge Repository :: Search Services'
          - 'Knowledge Repository :: Storage'
          - 'Web App :: All Services'
          - 'Web App :: Admin Portal'
          - 'Web App :: Agentic Platform'
          - 'Web App :: Docs Portal'
          - 'Web App :: Resources Platform'
      type:
        description: 'Report Type'
        required: true
        type: choice
        default: 'incident'
        options:
          - 'incident'
          - 'maintenance'
      status:
        description: 'Status (picking Resolved closes the active incident for the selected service)'
        required: true
        type: choice
        default: 'Investigating'
        options:
          - 'Investigating'
          - 'Identified'
          - 'Monitoring'
          - 'Scheduled'
          - 'In Progress'
          - 'Resolved'
      impact:
        description: 'Impact Level'
        required: true
        type: choice
        default: 'minor'
        options:
          - 'minor'
          - 'major'
          - 'critical'
          - 'none'
      title:
        description: 'Incident / Maintenance Title'
        required: true
        type: string
      content:
        description: 'Details / Status Update Message'
        required: true
        type: string
      incident_id:
        description: 'Optional Incident ID (leave blank to create new or auto-match active incident)'
        required: false
        type: string

concurrency:
  group: pulsecheck-web-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webApp/requirements.txt

      - name: Update Incidents & Regenerate Status Page
        working-directory: webApp
        env:
          INCIDENT_TARGET: ${{ inputs.target }}
          INCIDENT_TYPE: ${{ inputs.type }}
          INCIDENT_STATUS: ${{ inputs.status }}
          INCIDENT_IMPACT: ${{ inputs.impact }}
          INCIDENT_TITLE: ${{ inputs.title }}
          INCIDENT_CONTENT: ${{ inputs.content }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_BEARER_TOKEN: ${{ secrets.ALERT_WEBHOOK_BEARER_TOKEN }}
        run: |
          python manage_incident.py
          python monitor.py

      - name: Commit and Push Incident Update
        run: |
          git config --global user.name "Chandra Prakash"
          git config --global user.email "cprakashagr@gmail.com"
          git add webApp/incidents.yaml index.html rss.xml webApp/history.json
          if ! git diff --staged --quiet; then
            git commit -m "Incident update: ${{ inputs.target }} (${{ inputs.status }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
