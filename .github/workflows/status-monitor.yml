name: Status Monitor

on:
  schedule:
    - cron: '2,8,14,20,26,32,38,44,50,56 * * * *' # 10 times an hour (every 6 mins, offset to avoid GitHub queue spikes)
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - 'rss.xml'
      - 'webApp/history.json'
  workflow_dispatch:      # Manual trigger

concurrency:
  group: pulsecheck-web-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r webApp/requirements.txt

    - name: Run Health Checks
      working-directory: webApp
      env:
        # Pushover
        PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        # SendGrid (Professional Email)
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        # Webhook / API Call Alert
        ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        ALERT_WEBHOOK_BEARER_TOKEN: ${{ secrets.ALERT_WEBHOOK_BEARER_TOKEN }}
      run: python monitor.py

    - name: Commit and Push Status Page
      run: |
        git config --global user.name "Chandra Prakash"
        git config --global user.email "cprakashagr@gmail.com"
        git add index.html rss.xml webApp/history.json webApp/incidents.yaml
        if ! git diff --staged --quiet; then
          git commit -m "Update status, rss and history"
          git pull --rebase origin main
          git push origin HEAD:main
        fi
